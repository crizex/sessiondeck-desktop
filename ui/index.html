<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>SessionDeck</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="voice.css">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="search.css">
<link rel="stylesheet" href="timeline.css">
<link rel="stylesheet" href="broadcast.css">
<link rel="stylesheet" href="queue.css">
<link rel="stylesheet" href="recap.css">
<link rel="stylesheet" href="limit.css">
<link rel="stylesheet" href="messages.css">
</head>
<body>
<div id="window">
  <header id="bar">
    <nav id="tabs" aria-label="Sessions"><span id="frame" aria-hidden="true"></span>
      <button type="button" class="tab fixed" data-view="web" title="Web page from Settings (Ctrl+0)" hidden><svg class="icon-fixed" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg><span class="name">Web</span></button></nav>
    <button id="plus" type="button" title="New session" aria-label="New session">+</button>
    <div id="tools"></div>
    <button id="gear" class="tab fixed" type="button" data-view="settings" title="Settings (Ctrl+,)" aria-label="Settings"><svg class="icon-fixed" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  </header>

  <main id="area">
    <section class="pane" id="left" data-side="l"></section>
    <div id="divider" role="separator" aria-orientation="vertical" hidden></div>
    <section class="pane" id="right" data-side="r" hidden></section>
    <div id="pv-divider" role="separator" aria-orientation="vertical" aria-label="Preview width" hidden></div>
    <aside id="preview" aria-label="Preview" hidden>
      <div class="pv-head"><span id="pv-title"></span>
        <button type="button" id="pv-external">In browser</button>
        <button type="button" id="pv-close" aria-label="Close preview">×</button></div>
      <nav id="pv-history" aria-label="Recently viewed" hidden></nav>
      <div id="pv-content" hidden></div>
    </aside>
    <p id="empty" hidden><span>No session open. Start one with <kbd>+</kbd> at the top.</span></p>
  </main>

  <main id="web" class="view webpage" hidden></main>
  <main id="settings" class="view" hidden></main>

  <div id="banner" role="status" hidden></div>

  <div id="card" tabindex="0" role="dialog" aria-labelledby="card-question" hidden>
    <div class="from"><span id="card-who"></span><span id="card-count"></span></div>
    <h2 id="card-question"></h2>
    <div class="row" id="card-options"></div>
    <form id="card-free" hidden>
      <input id="card-text" autocomplete="off" aria-label="Your own answer">
      <button type="submit">Send <kbd>Enter</kbd></button>
    </form>
  </div>
  <button id="pill" type="button" hidden></button>
  <div id="compact" role="status" hidden><span id="compact-text"></span>
    <button type="button" id="compact-go">Send /compact</button>
    <button type="button" id="compact-hide" aria-label="Hide hint">×</button></div>

  <div id="update" role="status" hidden><i aria-hidden="true"></i><span><small>Update ready</small><b id="update-text"></b></span><button type="button" id="update-later">Remind me tomorrow</button><button type="button" id="update-button">Restart now</button></div>

  <div id="menu" hidden></div>
  <div id="store" hidden></div>
</div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script src="../state.js"></script>
<script src="app.js"></script>
<script src="preview.js"></script>
<script src="voice.js"></script>
<script src="live.js"></script>
<script src="search.js"></script>
<script src="timeline.js"></script>
<script src="broadcast.js"></script>
<script src="queue.js"></script>
<script src="recap.js"></script>
<script src="limit.js"></script>
<script src="messages.js"></script>
</body>
</html>
